<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iniciar sesión · Catálogo Interiorismo Perú</title>
<meta name="description" content="Acceso privado al Catálogo Interiorismo Perú">
<link rel="stylesheet" href="style.css">
<style>
.auth-page{min-height:100vh;display:grid;place-items:center;padding:32px;background:#f7f5f1}
.auth-card{width:min(440px,100%);background:#fff;border:1px solid #e8e3da;border-radius:20px;padding:36px;box-shadow:0 18px 50px rgba(35,30,25,.08)}
.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:30px;color:inherit;text-decoration:none}.auth-mark{width:42px;height:42px;border-radius:12px;background:#26221e;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;letter-spacing:.06em}.auth-brand strong{display:block;font-size:17px}.auth-brand small{display:block;font-size:10px;letter-spacing:.14em;color:#8a8278;margin-top:3px}.auth-card h1{font-size:30px;margin:0 0 8px}.auth-card>p{color:#756e65;margin:0 0 28px;line-height:1.6}.auth-field{display:grid;gap:8px;margin-bottom:16px}.auth-field label{font-size:12px;font-weight:700;letter-spacing:.04em}.auth-field input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #d9d2c8;border-radius:10px;font:inherit;background:#fff}.auth-submit{width:100%;border:0;border-radius:10px;padding:14px 16px;background:#26221e;color:#fff;font:inherit;font-weight:700;cursor:pointer}.auth-submit:disabled{opacity:.6;cursor:wait}.auth-message{min-height:20px;margin-top:14px;font-size:13px;color:#756e65}.auth-note{font-size:12px;color:#91897f;margin-top:24px;line-height:1.55}
</style>
</head>
<body>
<main class="auth-page">
<section class="auth-card">
<a class="auth-brand" href="index.html"><span class="auth-mark">CI</span><span><strong>Catálogo</strong><small>INTERIORISMO PERÚ</small></span></a>
<h1>Bienvenida</h1>
<p>Accede a tu biblioteca privada de productos, materiales y proyectos.</p>
<form id="loginForm">
<div class="auth-field"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="email" required></div>
<div class="auth-field"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div>
<button class="auth-submit" id="loginBtn" type="submit">Iniciar sesión</button>
<div class="auth-message" id="authMessage" role="status"></div>
</form>
<p class="auth-note">Este catálogo es privado. Las cuentas se habilitan por invitación.</p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const { createClient } = window.supabase;
const config = window.SUPABASE_CONFIG || {};
const message = document.getElementById('authMessage');
const button = document.getElementById('loginBtn');
if(!config.publishableKey || config.publishableKey.includes('PEGA_AQUI')){
  message.textContent='Falta configurar la Publishable key de Supabase.';
} else {
  const client = createClient(config.url, config.publishableKey);
  client.auth.getSession().then(({data})=>{ if(data.session) location.replace('index.html'); });
  document.getElementById('loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault(); message.textContent=''; button.disabled=true; button.textContent='Entrando…';
    const {error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});
    if(error){message.textContent='No pudimos iniciar sesión. Revisa tu correo y contraseña.'; button.disabled=false; button.textContent='Iniciar sesión'; return;}
    location.replace('index.html');
  });
}
</script>
</body>
</html>
